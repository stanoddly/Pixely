name: Publish Pixely development package

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PIXELY_VERSION_BASE_COMMIT: d5e9babf3149d0cbdc75d74b5cea33bc5461739e
  PIXELY_VERSION_BASE_NUMBER: 8

jobs:
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build Pixely.slnx -p:TreatWarningsAsErrors=true

      - name: Run tests
        run: dotnet test Pixely.slnx --no-build -p:TreatWarningsAsErrors=true

      - name: Stop build servers
        run: dotnet build-server shutdown

      - name: Run shader build integration tests
        run: dotnet test tests/Pixely.SdlangBuildIntegration.Tests/Pixely.SdlangBuildIntegration.Tests.csproj --no-build --filter 'TestCategory=BuildIntegration' -p:TreatWarningsAsErrors=true

      - name: Verify conditional logging in Release
        run: dotnet test tests/Pixely.Logging.Tests/Pixely.Logging.Tests.csproj --configuration Release -p:TreatWarningsAsErrors=true

      - name: Publish logging consumer with NativeAOT
        if: runner.os == 'Linux'
        run: dotnet publish tutorials/Pixely.Tutorials.Logging/Pixely.Tutorials.Logging.csproj --configuration Release --runtime linux-arm64 -p:TreatWarningsAsErrors=true

  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Select development version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if ! git merge-base --is-ancestor "$PIXELY_VERSION_BASE_COMMIT" "$GITHUB_SHA"; then
            echo "$PIXELY_VERSION_BASE_COMMIT is not an ancestor of $GITHUB_SHA."
            exit 1
          fi

          distance="$(git rev-list --first-parent --count "$PIXELY_VERSION_BASE_COMMIT..$GITHUB_SHA")"
          version="0.0.$((PIXELY_VERSION_BASE_NUMBER + distance))-alpha"
          artifact="Pixely-$version"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Selected Pixely $version for $GITHUB_SHA."

      - name: Pack validated commit
        env:
          PIXELY_VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY_COMMIT: ${{ github.sha }}
          REPOSITORY_BRANCH: ${{ github.ref }}
        run: >-
          dotnet pack packaging/Pixely/Pixely.Package.csproj
          --configuration Release
          --output artifacts/packages
          --property:PackageVersion=$PIXELY_VERSION
          --property:Version=$PIXELY_VERSION
          --property:RepositoryCommit=$REPOSITORY_COMMIT
          --property:RepositoryBranch=$REPOSITORY_BRANCH
          --property:ContinuousIntegrationBuild=true
          -p:TreatWarningsAsErrors=true

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            artifacts/packages/Pixely.${{ steps.version.outputs.version }}.nupkg
            artifacts/packages/Pixely.${{ steps.version.outputs.version }}.snupkg
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  package-consumer:
    needs: package
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: artifacts/package-under-test

      - name: Build package integration tests
        run: dotnet build tests/Pixely.Package.Tests/Pixely.Package.Tests.csproj -p:TreatWarningsAsErrors=true

      - name: Test local package consumers
        env:
          PIXELY_PACKAGE_DIRECTORY: ${{ github.workspace }}/artifacts/package-under-test
          PIXELY_PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: dotnet test tests/Pixely.Package.Tests/Pixely.Package.Tests.csproj --no-build --filter 'TestCategory=PackageIntegration' -p:TreatWarningsAsErrors=true

  package-validation:
    needs: package-consumer
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify package consumers
        env:
          PACKAGE_CONSUMER_RESULT: ${{ needs.package-consumer.result }}
        shell: bash
        run: |
          if [[ "$PACKAGE_CONSUMER_RESULT" != "success" ]]; then
            echo "Package consumer validation did not succeed."
            exit 1
          fi

  publish:
    needs: [package, package-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-pixely-development-package
      queue: max
    env:
      PIXELY_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Sleet
        run: dotnet tool restore

      - name: Download validated package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: artifacts/package-to-publish

      - name: Publish package to development feed
        shell: bash
        env:
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$B2_KEY_ID" || -z "$B2_APPLICATION_KEY" ]]; then
            echo "B2_KEY_ID and B2_APPLICATION_KEY repository secrets are required."
            exit 1
          fi

          dotnet tool run sleet -- push \
            "artifacts/package-to-publish/Pixely.$PIXELY_VERSION.nupkg" \
            --config packaging/sleet.json \
            --source pixely \
            --skip-existing

      - name: Store promotion artifacts
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_DEFAULT_REGION: eu-central-003
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_S3_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
          REPOSITORY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          get_object() {
            local key="$2"
            local head_error
            local target="$1"
            head_error="$(mktemp)"

            if aws --endpoint-url "$B2_S3_ENDPOINT" s3api head-object --bucket pixely --key "$key" >/dev/null 2>"$head_error"; then
              aws --endpoint-url "$B2_S3_ENDPOINT" s3api get-object --bucket pixely --key "$key" "$target" >/dev/null
              return 0
            fi

            if grep -Eq '\(404\)|Not Found|NoSuchKey' "$head_error"; then
              return 1
            else
              cat "$head_error"
              exit 1
            fi
          }

          upload_object() {
            local source="$1"
            local key="$2"
            local content_type="$3"

            aws --endpoint-url "$B2_S3_ENDPOINT" s3api put-object \
              --bucket pixely \
              --key "$key" \
              --body "$source" \
              --cache-control 'public, max-age=31536000, immutable' \
              --content-type "$content_type" >/dev/null
          }

          validate_package() {
            local package="$1"
            local nuspec
            nuspec="$(mktemp)"
            unzip -t "$package" >/dev/null
            unzip -p "$package" '*.nuspec' > "$nuspec"
            if ! grep -Fq "<version>$PIXELY_VERSION</version>" "$nuspec" || ! grep -Fq "commit=\"$REPOSITORY_COMMIT\"" "$nuspec"; then
              echo "$package does not match Pixely $PIXELY_VERSION from $REPOSITORY_COMMIT."
              exit 1
            fi
          }

          promotion_directory="artifacts/promotion"
          promotion_prefix="promotion/pixely/$PIXELY_VERSION"
          nupkg="$promotion_directory/Pixely.$PIXELY_VERSION.nupkg"
          snupkg="$promotion_directory/Pixely.$PIXELY_VERSION.snupkg"
          manifest="$promotion_directory/manifest.json"
          nupkg_url="https://pixely.s3.eu-central-003.backblazeb2.com/flatcontainer/pixely/$PIXELY_VERSION/pixely.$PIXELY_VERSION.nupkg"
          snupkg_url="https://pixely.s3.eu-central-003.backblazeb2.com/$promotion_prefix/Pixely.$PIXELY_VERSION.snupkg"
          symbol_key="$promotion_prefix/Pixely.$PIXELY_VERSION.snupkg"
          manifest_key="$promotion_prefix/manifest.json"
          mkdir -p "$promotion_directory"

          curl --fail --silent --show-error "$nupkg_url" --output "$nupkg"
          validate_package "$nupkg"

          if get_object "$snupkg" "$symbol_key"; then
            echo "Using the existing promotion symbol package."
          else
            cp "artifacts/package-to-publish/Pixely.$PIXELY_VERSION.snupkg" "$snupkg"
            upload_object "$snupkg" "$symbol_key" application/octet-stream
          fi
          validate_package "$snupkg"

          jq --null-input \
            --arg packageVersion "$PIXELY_VERSION" \
            --arg repositoryCommit "$REPOSITORY_COMMIT" \
            --arg nupkgUrl "$nupkg_url" \
            --arg nupkgSha256 "$(sha256sum "$nupkg" | cut -d ' ' -f 1)" \
            --arg snupkgUrl "$snupkg_url" \
            --arg snupkgSha256 "$(sha256sum "$snupkg" | cut -d ' ' -f 1)" \
            '{schemaVersion: 1, packageId: "Pixely", packageVersion: $packageVersion, repositoryCommit: $repositoryCommit, nupkg: {url: $nupkgUrl, sha256: $nupkgSha256}, snupkg: {url: $snupkgUrl, sha256: $snupkgSha256}}' \
            > "$manifest"

          existing_manifest="$(mktemp)"
          if get_object "$existing_manifest" "$manifest_key"; then
            if ! cmp --silent "$manifest" "$existing_manifest"; then
              echo "The existing promotion manifest has different content."
              exit 1
            fi
            echo "The promotion manifest already contains the expected content."
          else
            upload_object "$manifest" "$manifest_key" application/json
          fi
