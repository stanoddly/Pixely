name: Publish to development feed

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PIXELY_FEED_URL: https://nuget.stanoddly.dev
  PIXELY_VERSION_HEIGHT_OFFSET: '-281'
  R2_BUCKET: nuget

jobs:
  platform-validation:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Validate platform
        uses: ./.github/actions/validate-platform
        with:
          runtime: ${{ matrix.runtime }}

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Select development version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          height="$(git rev-list --first-parent --count "$GITHUB_SHA")"
          version="0.0.$((height + PIXELY_VERSION_HEIGHT_OFFSET))"
          artifact="Pixely-$version"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Selected Pixely $version for $GITHUB_SHA."

      - name: Pack commit
        env:
          PIXELY_VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY_COMMIT: ${{ github.sha }}
          REPOSITORY_BRANCH: ${{ github.ref }}
        run: >-
          dotnet pack packaging/Pixely/Pixely.Package.csproj
          --configuration Release
          --output artifacts/packages
          --property:PackageVersion=$PIXELY_VERSION
          --property:Version=$PIXELY_VERSION
          --property:RepositoryCommit=$REPOSITORY_COMMIT
          --property:RepositoryBranch=$REPOSITORY_BRANCH
          --property:ContinuousIntegrationBuild=true
          -p:TreatWarningsAsErrors=true

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            artifacts/packages/Pixely.${{ steps.version.outputs.version }}.nupkg
            artifacts/packages/Pixely.${{ steps.version.outputs.version }}.snupkg
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  package-consumer:
    needs: [package]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: artifacts/package-under-test

      # One lane relinks the browser runtime with a native reference; the others keep the workload-free browser build under test.
      - name: Install the wasm-tools workload
        if: matrix.os == 'ubuntu-24.04'
        run: dotnet workload install wasm-tools

      - name: Build package integration tests
        run: dotnet build tests/Pixely.Package.Tests/Pixely.Package.Tests.csproj -p:TreatWarningsAsErrors=true

      - name: Test local package consumers
        env:
          PIXELY_PACKAGE_DIRECTORY: ${{ github.workspace }}/artifacts/package-under-test
          PIXELY_PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: dotnet test tests/Pixely.Package.Tests/Pixely.Package.Tests.csproj --no-build --filter 'TestCategory=PackageIntegration' -p:TreatWarningsAsErrors=true

  publish:
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: publish-pixely-development-feed
      queue: max
    env:
      PIXELY_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Install Sleet
        run: dotnet tool install sleet --version 7.2.0 --tool-path "$RUNNER_TEMP/dotnet-tools"

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: artifacts/package-to-publish

      - name: Publish package to development feed
        shell: bash
        env:
          # R2 does not support the streaming SigV4 uploads and default checksums of the AWS SDK.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY repository secrets are required."
            exit 1
          fi

          sleet_config="$RUNNER_TEMP/sleet.json"
          jq --null-input \
            --arg feedUrl "$PIXELY_FEED_URL/" \
            --arg bucketName "$R2_BUCKET" \
            --arg serviceUrl "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            '{sources: [{name: "nuget", type: "s3", path: $feedUrl, baseURI: $feedUrl, bucketName: $bucketName, serviceURL: $serviceUrl, accessKeyId: "$R2_ACCESS_KEY_ID$", secretAccessKey: "$R2_SECRET_ACCESS_KEY$", disablePayloadSigning: true, immutableCacheControl: "public, max-age=31536000, immutable", mutableCacheControl: "public, max-age=60"}]}' \
            > "$sleet_config"

          "$RUNNER_TEMP/dotnet-tools/sleet" push \
            "artifacts/package-to-publish/Pixely.$PIXELY_VERSION.nupkg" \
            --config "$sleet_config" \
            --source nuget \
            --skip-existing

      - name: Report package availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_COMMIT: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          pull_request_number="$(gh api "repos/$REPOSITORY/commits/$REPOSITORY_COMMIT/pulls" --jq '.[0].number')"
          package_url="$PIXELY_FEED_URL/flatcontainer/pixely/$PIXELY_VERSION/pixely.$PIXELY_VERSION.nupkg"
          message="$(printf '📦 Development package [`Pixely %s`](%s) is available.' "$PIXELY_VERSION" "$package_url")"
          body="$(printf '%s\n\n[Workflow run (attempt %s)](%s)' "$message" "$RUN_ATTEMPT" "$RUN_URL")"
          gh api --method POST "repos/$REPOSITORY/issues/$pull_request_number/comments" --field body="$body" >/dev/null

      - name: Store promotion artifacts
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          REPOSITORY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          s3_endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

          get_object() {
            local key="$2"
            local head_error
            local target="$1"
            head_error="$(mktemp)"

            if aws --endpoint-url "$s3_endpoint" s3api head-object --bucket "$R2_BUCKET" --key "$key" >/dev/null 2>"$head_error"; then
              aws --endpoint-url "$s3_endpoint" s3api get-object --bucket "$R2_BUCKET" --key "$key" "$target" >/dev/null
              return 0
            fi

            if grep -Eq '\(404\)|Not Found|NoSuchKey' "$head_error"; then
              return 1
            else
              cat "$head_error"
              exit 1
            fi
          }

          upload_object() {
            local source="$1"
            local key="$2"
            local content_type="$3"

            aws --endpoint-url "$s3_endpoint" s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --body "$source" \
              --cache-control 'public, max-age=31536000, immutable' \
              --content-type "$content_type" >/dev/null
          }

          validate_package() {
            local package="$1"
            local nuspec
            nuspec="$(mktemp)"
            unzip -t "$package" >/dev/null
            unzip -p "$package" '*.nuspec' > "$nuspec"
            if ! grep -Fq "<version>$PIXELY_VERSION</version>" "$nuspec" || ! grep -Fq "commit=\"$REPOSITORY_COMMIT\"" "$nuspec"; then
              echo "$package does not match Pixely $PIXELY_VERSION from $REPOSITORY_COMMIT."
              exit 1
            fi
          }

          promotion_directory="artifacts/promotion"
          promotion_prefix="promotion/pixely/$PIXELY_VERSION"
          nupkg="$promotion_directory/Pixely.$PIXELY_VERSION.nupkg"
          snupkg="$promotion_directory/Pixely.$PIXELY_VERSION.snupkg"
          manifest="$promotion_directory/manifest.json"
          package_key="flatcontainer/pixely/$PIXELY_VERSION/pixely.$PIXELY_VERSION.nupkg"
          symbol_key="$promotion_prefix/Pixely.$PIXELY_VERSION.snupkg"
          manifest_key="$promotion_prefix/manifest.json"
          nupkg_url="$PIXELY_FEED_URL/$package_key"
          snupkg_url="$PIXELY_FEED_URL/$symbol_key"
          mkdir -p "$promotion_directory"

          # The feed's stored package is canonical; reading it through the S3 API keeps the CDN cache out of the check.
          if ! get_object "$nupkg" "$package_key"; then
            echo "The feed does not contain $package_key."
            exit 1
          fi
          validate_package "$nupkg"

          if get_object "$snupkg" "$symbol_key"; then
            echo "Using the existing promotion symbol package."
          else
            cp "artifacts/package-to-publish/Pixely.$PIXELY_VERSION.snupkg" "$snupkg"
            upload_object "$snupkg" "$symbol_key" application/octet-stream
          fi
          validate_package "$snupkg"

          jq --null-input \
            --arg packageVersion "$PIXELY_VERSION" \
            --arg repositoryCommit "$REPOSITORY_COMMIT" \
            --arg nupkgUrl "$nupkg_url" \
            --arg nupkgSha256 "$(sha256sum "$nupkg" | cut -d ' ' -f 1)" \
            --arg snupkgUrl "$snupkg_url" \
            --arg snupkgSha256 "$(sha256sum "$snupkg" | cut -d ' ' -f 1)" \
            '{schemaVersion: 1, packageId: "Pixely", packageVersion: $packageVersion, repositoryCommit: $repositoryCommit, nupkg: {url: $nupkgUrl, sha256: $nupkgSha256}, snupkg: {url: $snupkgUrl, sha256: $snupkgSha256}}' \
            > "$manifest"

          existing_manifest="$(mktemp)"
          if get_object "$existing_manifest" "$manifest_key"; then
            if ! cmp --silent "$manifest" "$existing_manifest"; then
              echo "The existing promotion manifest has different content."
              exit 1
            fi
            echo "The promotion manifest already contains the expected content."
          else
            upload_object "$manifest" "$manifest_key" application/json
          fi
