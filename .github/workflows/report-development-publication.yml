name: Report development publication

on:
  workflow_run:
    workflows: [Publish to development feed]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report validation result
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          pull_request_number="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].number')"

          case "$RUN_CONCLUSION" in
            success)
              message="✅ Development package validation passed on all platforms."
              ;;
            failure)
              failed_jobs="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest" --jq '.jobs[] | select(.conclusion == "failure") | "`" + .name + "`"' | paste -sd ' ' -)"
              message="❌ Development package validation failed: ${failed_jobs:-no failed job found}."
              ;;
            cancelled)
              message="⚪ Development package validation was cancelled."
              ;;
            *)
              message="$(printf 'ℹ️ Development package validation completed with conclusion `%s`.' "$RUN_CONCLUSION")"
              ;;
          esac

          body="$(printf '%s\n\n[Workflow run (attempt %s)](%s)' "$message" "$RUN_ATTEMPT" "$RUN_URL")"
          gh api --method POST "repos/$REPOSITORY/issues/$pull_request_number/comments" --field body="$body" >/dev/null
