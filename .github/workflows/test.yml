name: Pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull-request-validation:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Validate platform
        uses: ./.github/actions/validate-platform
        with:
          runtime: linux-arm64
          full-solution: 'true'

  # Runs beside the validation instead of after it. The browser test that relinks the runtime needs the wasm-tools workload and
  # skips here; it runs on the Ubuntu package-consumer lane after the merge, where the other platforms are covered as well.
  package-integration:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Build package integration tests
        run: dotnet build tests/Pixely.Package.Tests/Pixely.Package.Tests.csproj -p:TreatWarningsAsErrors=true

      - name: Run package integration tests against the repository build
        run: dotnet test tests/Pixely.Package.Tests/Pixely.Package.Tests.csproj --no-build --filter 'TestCategory=PackageIntegration' -p:TreatWarningsAsErrors=true
