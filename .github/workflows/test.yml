name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build Pixely.slnx -p:TreatWarningsAsErrors=true

      - name: Run tests
        run: dotnet test Pixely.slnx --no-build -p:TreatWarningsAsErrors=true
